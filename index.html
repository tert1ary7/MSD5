<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSD v7.0 | Geographic Metabolism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="command-center">
        <!-- Header Telemetry -->
        <header class="msd-header">
            <div class="brand">
                <h1>CHASING THE SUN</h1>
                <h2>GLOBAL METABOLISM & ROUTING | MSD v7.0</h2>
            </div>
            <div class="kpi-group">
                <div class="kpi">
                    <span class="label">METABOLIC VELOCITY</span>
                    <span id="stat-velocity" class="value cyan">+42/sec</span>
                </div>
                <div class="kpi">
                    <span class="label">CONCURRENCY ALERTS</span>
                    <span id="stat-critical" class="value amber">1</span>
                </div>
            </div>
        </header>

        <!-- Main Geographic Viewport -->
        <main class="viewport" id="viewport">
            <!-- World Map Underlay -->
            <div class="map-underlay"></div>
            <div class="terminator-sweep"></div>
            
            <!-- SVG Data Layer -->
            <svg id="data-layer" class="map-overlay" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <!-- Glowing Filters -->
                    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Layer Groups for proper stacking -->
                <g id="layer-chords"></g>
                <g id="layer-packets"></g>
                <g id="layer-callouts"></g>
                <g id="layer-clusters"></g>
                <g id="layer-nodes"></g>
            </svg>
        </main>

        <!-- Dynamic Timezone Ribbon -->
        <footer class="metabolism-ribbon">
            <div class="ribbon-header">
                <span class="ribbon-label">CONCURRENCY VOLUME BY TIMEZONE</span>
            </div>
            <div class="ribbon-track" id="ribbon-track">
                <!-- Stacked via JS -->
            </div>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
